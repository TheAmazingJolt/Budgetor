openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: budget
    description: Budget operations
  - name: auth
    description: Authentication operations
  - name: savedBudgets
    description: Saved budget operations
  - name: sheets
    description: Google Sheets operations
  - name: excel
    description: Microsoft Excel Online operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /budget/generate:
    post:
      operationId: generateBudget
      tags: [budget]
      summary: Generate weekly budgets
      description: Takes bill configuration and generates weekly budgets with balanced large-bill distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
      responses:
        "200":
          description: Generated weekly budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      description: Returns the currently authenticated user or null
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/guest:
    post:
      operationId: authGuestLogin
      tags: [auth]
      summary: Create or resume guest session
      description: Creates a new guest user or returns existing session user
      responses:
        "200":
          description: Guest user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      description: Clears the session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /auth/providers:
    get:
      operationId: authProviders
      tags: [auth]
      summary: Get available auth providers
      description: Returns which OAuth providers are configured
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/login/google:
    get:
      operationId: authLoginGoogle
      tags: [auth]
      summary: Get Google login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/login/apple:
    get:
      operationId: authLoginApple
      tags: [auth]
      summary: Get Apple login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Apple Sign-In URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /budgets:
    get:
      operationId: savedBudgetList
      tags: [savedBudgets]
      summary: List saved budgets
      description: Returns all saved budgets for the authenticated user
      responses:
        "200":
          description: List of saved budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: savedBudgetCreate
      tags: [savedBudgets]
      summary: Create a saved budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetCreateRequest"
      responses:
        "200":
          description: Created budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /budgets/{id}:
    put:
      operationId: savedBudgetUpdate
      tags: [savedBudgets]
      summary: Update a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetUpdateRequest"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: savedBudgetDelete
      tags: [savedBudgets]
      summary: Delete a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google/status:
    get:
      operationId: googleAuthStatus
      tags: [sheets]
      summary: Get Google Sheets OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthStatus"

  /auth/google:
    get:
      operationId: getGoogleAuthUrl
      tags: [sheets]
      summary: Get Google Sheets OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/google/disconnect:
    post:
      operationId: googleDisconnect
      tags: [sheets]
      summary: Disconnect Google Sheets OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /sheets/list:
    get:
      operationId: sheetList
      tags: [sheets]
      summary: List Google Sheets
      responses:
        "200":
          description: List of sheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetListResponse"

  /sheets/{id}/read:
    get:
      operationId: sheetRead
      tags: [sheets]
      summary: Read a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/read-url:
    post:
      operationId: sheetReadByUrl
      tags: [sheets]
      summary: Read a shared Google Sheet by URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetReadByUrlRequest"
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/{id}/write:
    post:
      operationId: sheetWrite
      tags: [sheets]
      summary: Write to a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetWriteResponse"

  /auth/microsoft/status:
    get:
      operationId: microsoftAuthStatus
      tags: [excel]
      summary: Get Microsoft OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftAuthStatus"

  /auth/microsoft:
    get:
      operationId: getMicrosoftAuthUrl
      tags: [excel]
      summary: Get Microsoft OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Microsoft OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/microsoft/disconnect:
    post:
      operationId: microsoftDisconnect
      tags: [excel]
      summary: Disconnect Microsoft OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /excel/list:
    get:
      operationId: excelList
      tags: [excel]
      summary: List Excel files in OneDrive
      responses:
        "200":
          description: List of Excel files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelListResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/read:
    get:
      operationId: excelRead
      tags: [excel]
      summary: Read an Excel file from OneDrive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/read-url:
    post:
      operationId: excelReadByUrl
      tags: [excel]
      summary: Read an Excel file by OneDrive share URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelReadByUrlRequest"
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/write:
    post:
      operationId: excelWrite
      tags: [excel]
      summary: Write budget weeks to an Excel file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelWriteResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Bill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
          description: Monthly amount (negative = expense)
        dayOfMonth:
          type: ["integer", "null"]
          description: Day of month bill is due (null for weekly bills)
        category:
          type: string
          enum: [rent, utilities, car, fixed, weekly]
          description: Category for large-bill balancing
      required:
        - name
        - amount
        - category

    WeeklyBill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
      required:
        - name
        - amount

    WeeklyBudget:
      type: object
      properties:
        weekLabel:
          type: string
          description: Human-readable label like "Budget from 3/5/26 to 3/11/26"
        startDate:
          type: string
          description: ISO date string for week start
        endDate:
          type: string
          description: ISO date string for week end
        openingBalance:
          type: number
          description: Amount remaining from previous week
        paycheck:
          type: number
          description: Paycheck received this week
        bills:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBill"
        totalBills:
          type: number
          description: Sum of all bill line items for this week
        closingBalance:
          type: number
          description: Amount remaining after all bills
      required:
        - weekLabel
        - startDate
        - endDate
        - openingBalance
        - paycheck
        - bills
        - totalBills
        - closingBalance

    BudgetRequest:
      type: object
      properties:
        startDate:
          type: string
          description: ISO date string for first week start
        endDate:
          type: string
          description: ISO date string for the last day of the final week
        openingBalance:
          type: number
          description: Starting account balance
        paycheckAmount:
          type: number
          description: Weekly paycheck amount
        numberOfWeeks:
          type: integer
          description: Number of weeks to generate (calculated from date range)
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
      required:
        - startDate
        - endDate
        - openingBalance
        - paycheckAmount
        - numberOfWeeks
        - bills

    BudgetResponse:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBudget"
        totalMonthlyBills:
          type: number
        averageWeeklyBills:
          type: number
      required:
        - weeks
        - totalMonthlyBills
        - averageWeeklyBills

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - createdAt

    AuthMeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    AuthUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required:
        - user

    AuthProviders:
      type: object
      properties:
        google:
          type: boolean
        apple:
          type: boolean
      required:
        - google
        - apple

    SavedBudget:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - bills
        - settings
        - createdAt
        - updatedAt

    SavedBudgetListResponse:
      type: object
      properties:
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/SavedBudget"
      required:
        - budgets

    SavedBudgetResponse:
      type: object
      properties:
        budget:
          $ref: "#/components/schemas/SavedBudget"
      required:
        - budget

    SavedBudgetCreateRequest:
      type: object
      properties:
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object
      required:
        - name
        - bills
        - settings

    SavedBudgetUpdateRequest:
      type: object
      properties:
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object

    GoogleAuthStatus:
      type: object
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
      required:
        - configured
        - authenticated

    SheetFile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        modifiedTime:
          type: string

    SheetListResponse:
      type: object
      properties:
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SheetFile"
      required:
        - sheets

    ExistingWeek:
      type: object
      properties:
        label:
          type: string
        startCol:
          type: number
        openingBalance:
          type: number
        paycheck:
          type: number
        items:
          type: array
          items:
            type: object
        remaining:
          type: number
      required:
        - label
        - startCol
        - openingBalance
        - paycheck
        - items
        - remaining

    SheetReadResponse:
      type: object
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
        existingWeeks:
          type: array
          items:
            $ref: "#/components/schemas/ExistingWeek"
        nextWeekStartCol:
          type: number
        lastRemaining:
          type: number
        sheetTitle:
          type: string
        spreadsheetId:
          type: string
      required:
        - bills
        - existingWeeks
        - nextWeekStartCol
        - lastRemaining
        - sheetTitle

    SheetReadByUrlRequest:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    SheetWriteRequest:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBudget"
        billsSummary:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
        sheetTitle:
          type: string
        startCol:
          type: number
        includeRemainingAcct:
          type: boolean
      required:
        - weeks
        - startCol

    SheetWriteResponse:
      type: object
      properties:
        success:
          type: boolean
        sheetTitle:
          type: string
      required:
        - success

    MicrosoftAuthStatus:
      type: object
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
      required:
        - configured
        - authenticated

    ExcelFile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        modifiedTime:
          type: string
      required:
        - id
        - name

    ExcelListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExcelFile"
      required:
        - files

    ExcelReadResponse:
      type: object
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
        existingWeeks:
          type: array
          items:
            $ref: "#/components/schemas/ExistingWeek"
        nextWeekStartCol:
          type: number
        lastRemaining:
          type: number
        sheetTitle:
          type: string
        fileId:
          type: string
      required:
        - bills
        - existingWeeks
        - nextWeekStartCol
        - lastRemaining
        - sheetTitle

    ExcelReadByUrlRequest:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    ExcelWriteRequest:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBudget"
        startCol:
          type: number
        includeRemainingAcct:
          type: boolean
        sheetTitle:
          type: string
      required:
        - weeks
        - startCol
        - includeRemainingAcct

    ExcelWriteResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok
