openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: budget
    description: Budget operations
  - name: auth
    description: Authentication operations
  - name: savedBudgets
    description: Saved budget operations
  - name: sheets
    description: Google Sheets operations
  - name: excel
    description: Microsoft Excel Online operations
  - name: bugReports
    description: Bug reporting operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /budget/generate:
    post:
      operationId: generateBudget
      tags: [budget]
      summary: Generate weekly budgets
      description: Takes bill configuration and generates weekly budgets with balanced large-bill distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
      responses:
        "200":
          description: Generated weekly budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      description: Returns the currently authenticated user or null
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/guest:
    post:
      operationId: authGuestLogin
      tags: [auth]
      summary: Create or resume guest session
      description: Creates a new guest user or returns existing session user
      responses:
        "200":
          description: Guest user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      description: Clears the session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /auth/register:
    post:
      operationId: authEmailRegister
      tags: [auth]
      summary: Register with email and password
      description: Creates a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "200":
          description: Registered user with JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login/email:
    post:
      operationId: authEmailLogin
      tags: [auth]
      summary: Log in with email and password
      description: Authenticates an existing user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Authenticated user with JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [auth]
      summary: Request a password reset
      description: Sends a password reset link to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent (or no-op if not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthForgotPasswordResponse"

  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Reset password with token
      description: Sets a new password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/claim-account:
    post:
      operationId: authClaimAccount
      tags: [auth]
      summary: Claim a legacy OAuth account
      description: Sets a password on a legacy OAuth-only account. Requires either an active session (no password yet) or a one-time claim token issued by an OAuth callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthClaimAccountRequest"
      responses:
        "200":
          description: Account claimed with JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          description: Validation error or account already has password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired claim token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/providers:
    get:
      operationId: authProviders
      tags: [auth]
      summary: Get available auth providers
      description: Returns which OAuth providers are configured
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/login/google:
    get:
      operationId: authLoginGoogle
      tags: [auth]
      summary: Get Google login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/login/apple:
    get:
      operationId: authLoginApple
      tags: [auth]
      summary: Get Apple login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Apple Sign-In URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /budgets:
    get:
      operationId: savedBudgetList
      tags: [savedBudgets]
      summary: List saved budgets
      description: Returns all saved budgets for the authenticated user
      responses:
        "200":
          description: List of saved budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: savedBudgetCreate
      tags: [savedBudgets]
      summary: Create a saved budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetCreateRequest"
      responses:
        "200":
          description: Created budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /budgets/{id}:
    put:
      operationId: savedBudgetUpdate
      tags: [savedBudgets]
      summary: Update a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetUpdateRequest"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: savedBudgetDelete
      tags: [savedBudgets]
      summary: Delete a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google/status:
    get:
      operationId: googleAuthStatus
      tags: [sheets]
      summary: Get Google Sheets OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthStatus"

  /auth/google:
    get:
      operationId: getGoogleAuthUrl
      tags: [sheets]
      summary: Get Google Sheets OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/google/disconnect:
    post:
      operationId: googleDisconnect
      tags: [sheets]
      summary: Disconnect Google Sheets OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /sheets/list:
    get:
      operationId: sheetList
      tags: [sheets]
      summary: List Google Sheets
      responses:
        "200":
          description: List of sheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetListResponse"

  /sheets/{id}/read:
    get:
      operationId: sheetRead
      tags: [sheets]
      summary: Read a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/read-url:
    post:
      operationId: sheetReadByUrl
      tags: [sheets]
      summary: Read a shared Google Sheet by URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetReadByUrlRequest"
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/{id}/write:
    post:
      operationId: sheetWrite
      tags: [sheets]
      summary: Write to a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetWriteResponse"

  /sheets/{id}:
    delete:
      operationId: sheetDelete
      tags: [sheets]
      summary: Delete a Google Sheet from Google Drive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /sheets/create-and-write:
    post:
      operationId: sheetCreateAndWrite
      tags: [sheets]
      summary: Create a new Google Sheet and write budget data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetCreateAndWriteRequest"
      responses:
        "200":
          description: Created spreadsheet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetCreateAndWriteResponse"

  /auth/microsoft/status:
    get:
      operationId: microsoftAuthStatus
      tags: [excel]
      summary: Get Microsoft OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftAuthStatus"

  /auth/microsoft:
    get:
      operationId: getMicrosoftAuthUrl
      tags: [excel]
      summary: Get Microsoft OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Microsoft OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/microsoft/disconnect:
    post:
      operationId: microsoftDisconnect
      tags: [excel]
      summary: Disconnect Microsoft OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /excel/list:
    get:
      operationId: excelList
      tags: [excel]
      summary: List Excel files in OneDrive
      responses:
        "200":
          description: List of Excel files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelListResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/read:
    get:
      operationId: excelRead
      tags: [excel]
      summary: Read an Excel file from OneDrive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/read-url:
    post:
      operationId: excelReadByUrl
      tags: [excel]
      summary: Read an Excel file by OneDrive share URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelReadByUrlRequest"
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/write:
    post:
      operationId: excelWrite
      tags: [excel]
      summary: Write budget weeks to an Excel file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelWriteResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}:
    delete:
      operationId: excelDelete
      tags: [excel]
      summary: Delete an Excel file from OneDrive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/create-and-write:
    post:
      operationId: excelCreateAndWrite
      tags: [excel]
      summary: Create a new Excel workbook in OneDrive and write budget data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelCreateAndWriteRequest"
      responses:
        "200":
          description: Created workbook info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelCreateAndWriteResponse"

  /bug-reports:
    post:
      operationId: createBugReport
      tags: [bugReports]
      summary: Submit a bug report
      description: Saves a bug report to the database and sends an email notification to the admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BugReportRequest"
      responses:
        "200":
          description: Bug report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/bills:
    get:
      operationId: getUserBills
      tags: [auth]
      summary: Get user bills
      description: Returns the authenticated user's saved bills
      responses:
        "200":
          description: User bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBillsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserBills
      tags: [auth]
      summary: Update user bills
      description: Replaces the authenticated user's saved bills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBillsRequest"
      responses:
        "200":
          description: Updated bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBillsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/debts:
    get:
      operationId: getUserDebts
      tags: [auth]
      summary: Get user debts
      description: Returns the authenticated user's saved debts
      responses:
        "200":
          description: User debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDebtsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserDebts
      tags: [auth]
      summary: Update user debts
      description: Replaces the authenticated user's saved debts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDebtsRequest"
      responses:
        "200":
          description: Updated debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDebtsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/preferences:
    get:
      operationId: getUserPreferences
      tags: [auth]
      summary: Get user preferences
      description: Returns the authenticated user's preferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserPreferences
      tags: [auth]
      summary: Update user preferences
      description: Merges the provided preferences into the authenticated user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Bill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
          description: Monthly amount (negative = expense)
        dayOfMonth:
          type: ["integer", "null"]
          description: Day of month bill is due (null for weekly bills)
        category:
          type: string
          description: User-defined label for this bill, e.g. Rent, Phone Bill
        type:
          type: string
          enum: [balanced, fixed, weekly, biweekly, yearly, yearly-flat]
          description: How the bill is distributed across weeks
        color:
          type: string
          description: Color key for UI display, e.g. blue, green, orange
        userColor:
          type: boolean
          description: True when the user explicitly chose this color (not auto-assigned by a heuristic)
        sourceDebtId:
          type: string
          description: ID of the debt this bill was imported from (if any)
        sourceGoalId:
          type: string
          description: ID of the savings goal this bill was imported from (if any)
        payoffDate:
          type: ["string", "null"]
          description: ISO date string after which this bill should stop appearing (debt payoff date)
        annualDueMonth:
          type: ["integer", "null"]
          description: Month (1-12) in which a yearly bill is due (null for non-yearly bills)
      required:
        - name
        - amount
        - category
        - type

    WeeklyBill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        color:
          type: string
      required:
        - name
        - amount

    WeeklyBudget:
      type: object
      properties:
        weekLabel:
          type: string
          description: Human-readable label like "Budget from 3/5/26 to 3/11/26"
        startDate:
          type: string
          description: ISO date string for week start
        endDate:
          type: string
          description: ISO date string for week end
        openingBalance:
          type: number
          description: Amount remaining from previous week
        paycheck:
          type: number
          description: Paycheck received this week (combined total from all sources)
        paycheckBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PaycheckBreakdownItem"
          description: Per-source breakdown of the paycheck total
        bills:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBill"
        totalBills:
          type: number
          description: Sum of all bill line items for this week
        closingBalance:
          type: number
          description: Amount remaining after all bills
      required:
        - weekLabel
        - startDate
        - endDate
        - openingBalance
        - paycheck
        - bills
        - totalBills
        - closingBalance

    IncomeSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: number
        frequency:
          type: string
          enum: [weekly, biweekly, monthly]
        nextPayDate:
          type: string
          description: ISO date string for the next pay date of this source
      required:
        - id
        - name
        - amount
        - frequency
        - nextPayDate

    PaycheckBreakdownItem:
      type: object
      properties:
        sourceId:
          type: string
        sourceName:
          type: string
        amount:
          type: number
      required:
        - sourceId
        - sourceName
        - amount

    BudgetRequest:
      type: object
      properties:
        startDate:
          type: string
          description: ISO date string for first week start
        endDate:
          type: string
          description: ISO date string for the last day of the final week
        openingBalance:
          type: number
          description: Starting account balance
        paycheckAmount:
          type: number
          description: Weekly paycheck amount (used when incomeSources is empty)
        numberOfWeeks:
          type: integer
          description: Number of weeks to generate (calculated from date range)
        payPeriod:
          type: string
          enum: [weekly, biweekly, monthly]
          description: "Budget period length: weekly (7 days), biweekly (14 days), or monthly (calendar month)"
        incomeSources:
          type: array
          items:
            $ref: "#/components/schemas/IncomeSource"
          description: Multiple income sources. When provided and non-empty, overrides paycheckAmount.
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
        priorSavings:
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties:
              type: number
          description: >
            Map of monthKey (YYYY-M, 0-indexed month) to billName to positive
            amount already saved this month before the budget start date. When
            present, balanced bill allocations for the matching month are reduced
            by the saved amount before being spread across weeks.
      required:
        - startDate
        - endDate
        - openingBalance
        - paycheckAmount
        - numberOfWeeks
        - bills

