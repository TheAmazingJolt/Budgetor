openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: budget
    description: Budget operations
  - name: auth
    description: Authentication operations
  - name: savedBudgets
    description: Saved budget operations
  - name: sheets
    description: Google Sheets operations
  - name: excel
    description: Microsoft Excel Online operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /budget/generate:
    post:
      operationId: generateBudget
      tags: [budget]
      summary: Generate weekly budgets
      description: Takes bill configuration and generates weekly budgets with balanced large-bill distribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
      responses:
        "200":
          description: Generated weekly budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user
      description: Returns the currently authenticated user or null
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"

  /auth/guest:
    post:
      operationId: authGuestLogin
      tags: [auth]
      summary: Create or resume guest session
      description: Creates a new guest user or returns existing session user
      responses:
        "200":
          description: Guest user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      description: Clears the session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /auth/providers:
    get:
      operationId: authProviders
      tags: [auth]
      summary: Get available auth providers
      description: Returns which OAuth providers are configured
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"

  /auth/login/google:
    get:
      operationId: authLoginGoogle
      tags: [auth]
      summary: Get Google login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/login/apple:
    get:
      operationId: authLoginApple
      tags: [auth]
      summary: Get Apple login URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Apple Sign-In URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /budgets:
    get:
      operationId: savedBudgetList
      tags: [savedBudgets]
      summary: List saved budgets
      description: Returns all saved budgets for the authenticated user
      responses:
        "200":
          description: List of saved budgets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: savedBudgetCreate
      tags: [savedBudgets]
      summary: Create a saved budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetCreateRequest"
      responses:
        "200":
          description: Created budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /budgets/{id}:
    put:
      operationId: savedBudgetUpdate
      tags: [savedBudgets]
      summary: Update a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedBudgetUpdateRequest"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: savedBudgetDelete
      tags: [savedBudgets]
      summary: Delete a saved budget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google/status:
    get:
      operationId: googleAuthStatus
      tags: [sheets]
      summary: Get Google Sheets OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthStatus"

  /auth/google:
    get:
      operationId: getGoogleAuthUrl
      tags: [sheets]
      summary: Get Google Sheets OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Google OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/google/disconnect:
    post:
      operationId: googleDisconnect
      tags: [sheets]
      summary: Disconnect Google Sheets OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /sheets/list:
    get:
      operationId: sheetList
      tags: [sheets]
      summary: List Google Sheets
      responses:
        "200":
          description: List of sheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetListResponse"

  /sheets/{id}/read:
    get:
      operationId: sheetRead
      tags: [sheets]
      summary: Read a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/read-url:
    post:
      operationId: sheetReadByUrl
      tags: [sheets]
      summary: Read a shared Google Sheet by URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetReadByUrlRequest"
      responses:
        "200":
          description: Sheet data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetReadResponse"

  /sheets/{id}/write:
    post:
      operationId: sheetWrite
      tags: [sheets]
      summary: Write to a Google Sheet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetWriteResponse"

  /sheets/{id}:
    delete:
      operationId: sheetDelete
      tags: [sheets]
      summary: Delete a Google Sheet from Google Drive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /sheets/create-and-write:
    post:
      operationId: sheetCreateAndWrite
      tags: [sheets]
      summary: Create a new Google Sheet and write budget data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetCreateAndWriteRequest"
      responses:
        "200":
          description: Created spreadsheet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetCreateAndWriteResponse"

  /auth/microsoft/status:
    get:
      operationId: microsoftAuthStatus
      tags: [excel]
      summary: Get Microsoft OAuth status
      responses:
        "200":
          description: OAuth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicrosoftAuthStatus"

  /auth/microsoft:
    get:
      operationId: getMicrosoftAuthUrl
      tags: [excel]
      summary: Get Microsoft OAuth URL
      parameters:
        - name: redirect
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Microsoft OAuth URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url

  /auth/microsoft/disconnect:
    post:
      operationId: microsoftDisconnect
      tags: [excel]
      summary: Disconnect Microsoft OAuth
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /excel/list:
    get:
      operationId: excelList
      tags: [excel]
      summary: List Excel files in OneDrive
      responses:
        "200":
          description: List of Excel files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelListResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/read:
    get:
      operationId: excelRead
      tags: [excel]
      summary: Read an Excel file from OneDrive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/read-url:
    post:
      operationId: excelReadByUrl
      tags: [excel]
      summary: Read an Excel file by OneDrive share URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelReadByUrlRequest"
      responses:
        "200":
          description: Excel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelReadResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}/write:
    post:
      operationId: excelWrite
      tags: [excel]
      summary: Write budget weeks to an Excel file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelWriteRequest"
      responses:
        "200":
          description: Write result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelWriteResponse"
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/{id}:
    delete:
      operationId: excelDelete
      tags: [excel]
      summary: Delete an Excel file from OneDrive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated with Microsoft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /excel/create-and-write:
    post:
      operationId: excelCreateAndWrite
      tags: [excel]
      summary: Create a new Excel workbook in OneDrive and write budget data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcelCreateAndWriteRequest"
      responses:
        "200":
          description: Created workbook info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelCreateAndWriteResponse"

  /user/bills:
    get:
      operationId: getUserBills
      tags: [auth]
      summary: Get user bills
      description: Returns the authenticated user's saved bills
      responses:
        "200":
          description: User bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBillsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserBills
      tags: [auth]
      summary: Update user bills
      description: Replaces the authenticated user's saved bills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBillsRequest"
      responses:
        "200":
          description: Updated bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBillsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/debts:
    get:
      operationId: getUserDebts
      tags: [auth]
      summary: Get user debts
      description: Returns the authenticated user's saved debts
      responses:
        "200":
          description: User debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDebtsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserDebts
      tags: [auth]
      summary: Update user debts
      description: Replaces the authenticated user's saved debts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDebtsRequest"
      responses:
        "200":
          description: Updated debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDebtsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/preferences:
    get:
      operationId: getUserPreferences
      tags: [auth]
      summary: Get user preferences
      description: Returns the authenticated user's preferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserPreferences
      tags: [auth]
      summary: Update user preferences
      description: Merges the provided preferences into the authenticated user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Bill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
          description: Monthly amount (negative = expense)
        dayOfMonth:
          type: ["integer", "null"]
          description: Day of month bill is due (null for weekly bills)
        category:
          type: string
          description: User-defined label for this bill, e.g. Rent, Phone Bill
        type:
          type: string
          enum: [balanced, fixed, weekly]
          description: How the bill is distributed across weeks
        color:
          type: string
          description: Color key for UI display, e.g. blue, green, orange
        userColor:
          type: boolean
          description: True when the user explicitly chose this color (not auto-assigned by a heuristic)
        sourceDebtId:
          type: string
          description: ID of the debt this bill was imported from (if any)
      required:
        - name
        - amount
        - category
        - type

    WeeklyBill:
      type: object
      properties:
        name:
          type: string
        amount:
          type: number
        color:
          type: string
      required:
        - name
        - amount

    WeeklyBudget:
      type: object
      properties:
        weekLabel:
          type: string
          description: Human-readable label like "Budget from 3/5/26 to 3/11/26"
        startDate:
          type: string
          description: ISO date string for week start
        endDate:
          type: string
          description: ISO date string for week end
        openingBalance:
          type: number
          description: Amount remaining from previous week
        paycheck:
          type: number
          description: Paycheck received this week
        bills:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBill"
        totalBills:
          type: number
          description: Sum of all bill line items for this week
        closingBalance:
          type: number
          description: Amount remaining after all bills
      required:
        - weekLabel
        - startDate
        - endDate
        - openingBalance
        - paycheck
        - bills
        - totalBills
        - closingBalance

    BudgetRequest:
      type: object
      properties:
        startDate:
          type: string
          description: ISO date string for first week start
        endDate:
          type: string
          description: ISO date string for the last day of the final week
        openingBalance:
          type: number
          description: Starting account balance
        paycheckAmount:
          type: number
          description: Weekly paycheck amount
        numberOfWeeks:
          type: integer
          description: Number of weeks to generate (calculated from date range)
        payPeriod:
          type: string
          enum: [weekly, biweekly, monthly]
          description: "Budget period length: weekly (7 days), biweekly (14 days), or monthly (calendar month)"
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
      required:
        - startDate
        - endDate
        - openingBalance
        - paycheckAmount
        - numberOfWeeks
        - bills

    BudgetResponse:
      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBudget"
        totalMonthlyBills:
          type: number
        averageWeeklyBills:
          type: number
      required:
        - weeks
        - totalMonthlyBills
        - averageWeeklyBills

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - provider
        - createdAt

    AuthMeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    AuthUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        token:
          type: string
      required:
        - user

    AuthProviders:
      type: object
      properties:
        google:
          type: boolean
        apple:
          type: boolean
      required:
        - google
        - apple

    DebtType:
      type: string
      enum:
        - credit_card
        - personal_loan
        - student_loan
        - car_loan
        - installment
        - collections

    Debt:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/DebtType"
        balance:
          type: number
          description: Current balance owed (positive number)
        interestRate:
          type: number
          nullable: true
          description: APR percentage (optional)
        minimumPayment:
          type: number
          description: Minimum monthly/weekly payment amount (positive number)
        originalAmount:
          type: number
          nullable: true
          description: Original amount borrowed or charged (optional, for tracking payoff progress)
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: Day of month the payment is due (1-31, optional)
        billAsBalanced:
          type: boolean
          nullable: true
          description: When true, the auto-generated linked bill uses "Balanced" type (spread evenly across weeks)
        excludeFromBill:
          type: boolean
          nullable: true
          description: When true, the user has opted this debt out of auto-generating a bill
      required:
        - id
        - name
        - type
        - balance
        - minimumPayment

    SavedBudget:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object
        debts:
          type: array
          items:
            $ref: "#/components/schemas/Debt"
        linkedSheetId:
          type: string
          nullable: true
          description: ID of the linked Google Sheet or Excel file (null if no link)
        linkedSheetName:
          type: string
          nullable: true
          description: Display name of the linked sheet/file
        linkedSheetType:
          type: string
          nullable: true
          enum: [google, excel]
          description: Type of linked sheet ('google' or 'excel')
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - bills
        - settings
        - createdAt
        - updatedAt

    SavedBudgetListResponse:
      type: object
      properties:
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/SavedBudget"
      required:
        - budgets

    SavedBudgetResponse:
      type: object
      properties:
        budget:
          $ref: "#/components/schemas/SavedBudget"
      required:
        - budget

    SavedBudgetCreateRequest:
      type: object
      properties:
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object
        debts:
          type: array
          items:
            $ref: "#/components/schemas/Debt"
      required:
        - name
        - bills
        - settings

    SavedBudgetUpdateRequest:
      type: object
      properties:
        name:
          type: string
        bills:
          type: array
          items: {}
        settings:
          type: object
        debts:
          type: array
          items:
            $ref: "#/components/schemas/Debt"
        linkedSheetId:
          type: string
          nullable: true
          description: ID of the linked Google Sheet or Excel file (null clears the link)
        linkedSheetName:
          type: string
          nullable: true
          description: Display name of the linked sheet/file
        linkedSheetType:
