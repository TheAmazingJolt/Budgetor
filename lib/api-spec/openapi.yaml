        - lump_sum

    Debt:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/DebtType"
        balance:
          type: number
          description: Current balance owed (positive number)
        interestRate:
          type: number
          nullable: true
          description: APR percentage (optional)
        minimumPayment:
          type: number
          description: Minimum monthly/weekly payment amount (positive number)
        originalAmount:
          type: number
          nullable: true
          description: Original amount borrowed or charged (optional, for tracking payoff progress)
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: Day of month the payment is due (1-31, optional)
        billAsBalanced:
          type: boolean
          nullable: true
          description: When true, the auto-generated linked bill uses "Balanced" type (spread evenly across weeks)
        excludeFromBill:
          type: boolean
          nullable: true
          description: When true, the user has opted this debt out of auto-generating a bill
        lastPaymentDate:
          type: string
          nullable: true
          description: ISO date string of the most recent logged payment (optional)
        lastPaymentAmount:
          type: number
          nullable: true
          description: Amount of the most recent logged payment (optional)
        createdAt:
          type: string
          nullable: true
          description: ISO date string when the debt was created (optional, used for payment-due nudge)
        paymentFrequency:
          type: string
          nullable: true
          enum: [monthly, weekly, biweekly]
          description: Payment cadence for installment debts. Defaults to monthly. Weekly/biweekly generate a recurring bill in every applicable budget period.
        paymentsRemaining:
          type: integer
          nullable: true
          minimum: 1
          description: Optional count of payments remaining (for fixed-installment debts). When provided, payoff date is derived from this count × payment frequency, overriding the balance/rate formula.
        dueDate:
          type: string
          nullable: true
          description: ISO date string for the payment due date (used by lump_sum debts as the single payoff date).
      required:
        - id
        - name
        - type
        - balance
        - minimumPayment

