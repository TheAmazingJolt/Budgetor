      type: object
      properties:
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyBudget"
        totalMonthlyBills:
          type: number
        averageWeeklyBills:
          type: number
      required:
        - weeks
        - totalMonthlyBills
        - averageWeeklyBills

