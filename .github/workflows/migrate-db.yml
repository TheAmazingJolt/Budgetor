name: Migrate Staging → Production DB

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgres client 18
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump staging
        run: |
          /usr/lib/postgresql/18/bin/pg_dump "${{ secrets.STAGING_DATABASE_URL }}" \
            --no-owner \
            --no-acl \
            --format=plain \
            --clean \
            --if-exists \
            --disable-triggers \
            --file=staging.sql

      - name: Restore to production
        run: |
          /usr/lib/postgresql/18/bin/psql "${{ secrets.PROD_DATABASE_URL }}" \
            --set ON_ERROR_STOP=1 \
            --file=staging.sql
