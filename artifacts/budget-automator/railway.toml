[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/budget-automator/Dockerfile"
buildArgs = ["VITE_API_BASE_URL=${{VITE_API_BASE_URL}}"]

[deploy]
startCommand = "pnpm --filter @workspace/budget-automator serve"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
